# Tagging eval. Each case gives a made-up User an ended Conversation, with
# the Life Threads it touched, and runs the real tagging step on it alone,
# with the whole Pattern Catalog. Code then checks what it wrote, as it does
# for real Users, and the Observations it keeps are compared with the ones
# expected below.
#
# Drafted by Claude to start; the owner corrects them (they are the one rater
# so far). See docs/pattern-evals/README.md for what this Eval can and can't
# show.
#
# `now` is when the first message was sent (UTC, which is also the person's
# time zone); the messages come a minute apart. A case can set its own `now`.
#
# threads: [{title, story, people}]   the Life Threads the Conversation touched,
#                                     shown to the tagging step numbered, in order
# messages: [{who, text}]
#   who: person | zeph                only the person's own words can be quoted
#
# observations: the Observations that must be kept. The case passes only when
# every one is kept and nothing else is. Several quotes kept for one entry
# still match it. Leave it out when there is nothing to tag.
#   - pattern_type: <Pattern Type ID>  when unclear, either of the two
#     direction: for | against
#     unclear: true                    when it could be either of two look-alikes
#     situational: true                when anyone would have acted the same:
#                                      the Observation's tags fit one of its
#                                      Pattern Type's `anyone_would_when`, for
#                                      or against
#
# unclear: unclear Observations the made-up User already has, from earlier
# Conversations (issue 25). One with `asked` on was asked about in this
# Conversation by an aimed Curiosity, so the real tagging step is shown it
# and may settle it. Each must end as the case says.
#   - pattern_type: <Pattern Type ID>  the first of its two
#     second_pattern_type: <ID>        the look-alike
#     quote, sign, direction, context, about, days_ago, thread, setting,
#     relationship                     as in understanding.yaml's patterns
#     asked: true                      default true
#     ends_clear_for: <ID>             one of its two; leave out when it must
#                                      stay unclear

now: 2026-11-24T10:00:00

cases:
