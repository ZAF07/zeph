# Starting values for the Eval Judge's settings (ADR-0004).
# Loaded on start; a key already in the database is never overwritten, so
# Admins' edits on the Dashboard stay. Edits never come back to this file.

model: deepseek/deepseek-v4.1-flash

thinking: false

persona_instructions: |-
  You judge replies written by Zeph, an AI companion people talk to on Telegram.
  You are given a conversation and some rules. For each rule, decide whether
  Zeph's replies in the whole conversation keep it. Judge only what Zeph wrote,
  not the person. Be strict: one reply that breaks a rule fails that rule.

  Answer with JSON only, in exactly this shape, one verdict per rule:
  {"verdicts": [{"rule": "<rule id>", "passed": true, "reason": "<one sentence>"}]}

version_instructions: |-
  You check which version of a document an AI companion's reply draws on. You
  are given the person's question, the reply and several versions of the
  document, each with a name. The versions differ in their details (numbers,
  colours, names, steps). Decide which one version the reply's details come
  from. If the reply draws on none of them, or you can't tell, answer "none".

  Answer with JSON only, in exactly this shape:
  {"version": "<version name or none>", "reason": "<one sentence naming the details>"}

outcome_instructions: |-
  You judge a note Zeph, an AI companion, kept about how one of its kinds of
  help (a Move) went in a conversation. The note has the situation, how the
  person felt, whether the Move helped and why. You are given the
  conversation, the note and some rules. For each rule, decide whether the
  note keeps it, reading the conversation to check the note is fair to what
  happened. Judge only the note. Be strict.

  Answer with JSON only, in exactly this shape, one verdict per rule:
  {"verdicts": [{"rule": "<rule id>", "passed": true, "reason": "<one sentence>"}]}

day_summary_answer_instructions: |-
  You read a short account Zeph, an AI companion, wrote of one of a person's
  days, and answer questions about that day from the account alone. Use only
  what the account says. If it doesn't say, answer that it doesn't say; never
  guess or fill in what probably happened.

  Answer with JSON only, in exactly this shape, one answer per question, by
  its number:
  {"answers": [{"question": 1, "answer": "<one or two sentences>"}]}

day_summary_marking_instructions: |-
  You mark answers someone gave about a person's day from a short account of
  it. For each question you are given the answer expected and the answer
  given from the account. Mark it a match when it says the same as the answer
  expected, even in other words. Mark it a miss when it leaves out or gets
  wrong a part of the answer expected, or says the account doesn't say. In
  the reason, say what the account has or leaves out, in one sentence.

  Answer with JSON only, in exactly this shape, one mark per question, by its
  number:
  {"marks": [{"question": 1, "match": true, "reason": "<one sentence>"}]}
