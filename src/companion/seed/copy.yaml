      max_length: 60
      text: Look at my photos
    - key: account.photos.explanation
      name: "Look at my photos: what Photo Viewing is; a blank line starts a new paragraph"
      max_length: 1000
      text: |-
        When off, Zeph won't look at or remember your photos. Every photo is still checked for safety, so Zeph can share help if one looks worrying. Nothing from that check is kept.

        When on, Zeph looks at the photos you send and may keep the ones that matter to you, listed on your Memories page.
    - key: account.directness.title
      name: "How direct Zeph is: heading and name read out by screen readers"
      max_length: 60
      text: How direct Zeph is
    - key: account.directness.help
      name: "How direct Zeph is: what the setting changes"
      max_length: 400
      text: >-
        How soon and how plainly Zeph tells you what it thinks is really going
        on. Whatever you pick, Zeph gives its view when you ask, and takes extra
        care when things are hard.
    - key: account.directness.gentle
      name: "How direct Zeph is: gentle level"
      max_length: 20
      text: Gentle
    - key: account.directness.balanced
      name: "How direct Zeph is: balanced level"
      max_length: 20
      text: Balanced
    - key: account.directness.direct
      name: "How direct Zeph is: direct level"
      max_length: 20
      text: Direct
    - key: account.contested_gathering.title
      name: "Keep noticing after I disagree: heading and name read out by screen readers"
      max_length: 60
      text: Keep noticing after I disagree
    - key: account.contested_gathering.explanation
      name: "Keep noticing after I disagree: what the switch does; a blank line starts a new paragraph"
      max_length: 1000
      text: |-
        When Zeph tells you something it has noticed about you and you disagree, it never brings it up again unless you do.

        When on, Zeph still quietly notes what you say that fits it, in case it holds up after all. When off, it notes nothing new for it. Every quote Zeph keeps is listed on your Memories page, where you can delete any of them.
