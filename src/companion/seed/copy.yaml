- tab: how_it_works
  name: How it works
  slots:
    - key: how_it_works.page_title
      name: Browser tab title
      max_length: 70
      text: Zeph — How it works
    - key: how_it_works.page_description
      name: Search description
      max_length: 160
      text: >-
        You sign up here and talk to Zeph in Telegram. This site is where you
        see what it remembers and decide how it behaves.
    - key: how_it_works.hero.eyebrow
      name: Label above the main heading
      max_length: 40
      text: How it works
    - key: how_it_works.hero.heading_first_line
      name: Main heading, first line
      max_length: 30
      text: One conversation,
    - key: how_it_works.hero.heading_second_line
      name: Main heading, second line
      max_length: 30
      text: carried through your days.
    - key: how_it_works.hero.lead
      name: Line under the main heading
      max_length: 200
      text: >-
        You sign up here and talk to Zeph in Telegram. This site is where you
        see what it remembers and decide how it behaves. Five steps, most of
        them one tap.
    - key: how_it_works.steps.eyebrow
      name: "Steps: label"
      max_length: 40
      text: From sign-up to check-in
    - key: how_it_works.steps.heading_first_line
      name: "Steps: heading, first line"
      max_length: 30
      text: What happens,
    - key: how_it_works.steps.heading_second_line
      name: "Steps: heading, second line"
      max_length: 30
      text: in order.
    - key: how_it_works.steps.lead
      name: "Steps: line under the heading"
      max_length: 120
      text: >-
        Steps one and two happen once. The rest is the conversation itself.
    - key: how_it_works.steps.step_1.title
      name: "Step 1: title"
      max_length: 40
      text: Create your account
    - key: how_it_works.steps.step_1.tag
      name: "Step 1: tag"
      max_length: 24
      text: About two minutes
    - key: how_it_works.steps.step_1.text
      name: "Step 1: text"
      max_length: 250
      text: >-
        Sign up on this site and answer a few short questions: what to call
        you, what brings you here, and whether Zeph may remember things and
        check in on you.
    - key: how_it_works.steps.step_2.title
      name: "Step 2: title"
      max_length: 40
      text: Connect Telegram
    - key: how_it_works.steps.step_2.tag
      name: "Step 2: tag"
      max_length: 24
      text: One tap
    - key: how_it_works.steps.step_2.text
      name: "Step 2: text"
      max_length: 250
      text: >-
        One tap links your account to Zeph on Telegram. Every conversation
        happens there, so there is no new app to learn.
    - key: how_it_works.steps.step_3.title
      name: "Step 3: title"
      max_length: 40
      text: Talk it through
    - key: how_it_works.steps.step_3.tag
      name: "Step 3: tag"
      max_length: 24
      text: Whenever you like
    - key: how_it_works.steps.step_3.text
      name: "Step 3: text"
      max_length: 250
      text: >-
        Message Zeph the way you would message a thoughtful friend. It asks
        questions, listens, and disagrees when that is more useful than
        agreeing. It draws on philosophy, psychology and mindfulness, in plain
        words.
    - key: how_it_works.steps.step_4.title
      name: "Step 4: title"
      max_length: 40
      text: It remembers, with your permission
    - key: how_it_works.steps.step_4.tag
      name: "Step 4: tag"
      max_length: 24
      text: Your choice
    - key: how_it_works.steps.step_4.text
      name: "Step 4: text"
      max_length: 250
      text: >-
        If you allow it, Zeph keeps the details that matter, like your goals
        and the people you mention, so you never start from zero. You can read
        every memory and delete any of them.
    - key: how_it_works.steps.step_5.title
      name: "Step 5: title"
      max_length: 40
      text: It checks in, if you want it to
    - key: how_it_works.steps.step_5.tag
      name: "Step 5: tag"
      max_length: 24
      text: Your choice
    - key: how_it_works.steps.step_5.text
      name: "Step 5: text"
      max_length: 250
      text: >-
        Turn check-ins on and Zeph will sometimes message you first. You set
        how often at most and your quiet hours. Zeph chooses the moment, and
        sometimes stays quiet to give you space.
    - key: how_it_works.dashboard.eyebrow
      name: "Your dashboard: label"
      max_length: 40
      text: Your dashboard
    - key: how_it_works.dashboard.heading_first_line
      name: "Your dashboard: heading, first line"
      max_length: 30
      text: You decide
    - key: how_it_works.dashboard.heading_second_line
      name: "Your dashboard: heading, second line"
      max_length: 30
      text: what Zeph keeps.
    - key: how_it_works.dashboard.lead
      name: "Your dashboard: line under the heading"
      max_length: 120
      text: >-
        Everything Zeph holds about you is visible on this site, and all of it
        can be removed.
    - key: how_it_works.dashboard.memories.title
      name: "Your dashboard: first card, title"
      max_length: 30
      text: Memories
    - key: how_it_works.dashboard.memories.text
      name: "Your dashboard: first card, text"
      max_length: 120
      text: >-
        Read what Zeph remembers and delete any of it, one item or everything.
    - key: how_it_works.dashboard.check_ins.title
      name: "Your dashboard: second card, title"
      max_length: 30
      text: Check-ins
    - key: how_it_works.dashboard.check_ins.text
      name: "Your dashboard: second card, text"
      max_length: 120
      text: >-
        Change how often, set quiet hours, pause for a day or a week, or switch
        them off.
    - key: how_it_works.dashboard.account.title
      name: "Your dashboard: third card, title"
      max_length: 30
      text: Account & privacy
    - key: how_it_works.dashboard.account.text
      name: "Your dashboard: third card, text"
      max_length: 120
      text: >-
        Turn memory off, stop Zeph looking at photos, delete your data or your
        account.
    - key: how_it_works.dashboard.not_title
      name: "What Zeph is not: title"
      max_length: 40
      text: What Zeph is not.
    - key: how_it_works.dashboard.not_text
      name: "What Zeph is not: text"
      max_length: 200
      text: >-
        Zeph is an AI. It is not a therapist, a doctor or a crisis service, and
        it cannot help in an emergency.
    - key: how_it_works.ready.heading
      name: "Sign-up band: heading"
      max_length: 40
      text: Ready when you are.
    - key: how_it_works.ready.text
      name: "Sign-up band: line under the heading"
      max_length: 120
      text: >-
        Start free. It takes about two minutes to reach your first
        conversation.
    - key: how_it_works.ready.sign_up_button
      name: "Sign-up band: sign-up button"
      max_length: 30
      text: Get Started Free
    - key: how_it_works.ready.pricing_link
      name: "Sign-up band: pricing button"
      max_length: 30
      text: See pricing

