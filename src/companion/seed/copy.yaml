    - key: shared.memory_explanation
      name: >-
        What User Memory is, in onboarding and on Account; a blank line starts a
        new paragraph
      max_length: 1000
      text: |-
        So you don't have to repeat yourself, I can keep meaningful details: your goals, what helps you, the people you mention.

        You can see what I remember on your Dashboard and delete any of it, or tell me "forget that" in chat.

        I also keep a few private notes to follow up with you, like something to ask about later. You won't see these, and Delete My Data removes them along with everything else.
    - key: shared.pattern_noticing.title
      name: "What changed, before Zeph keeps quotes: title, on Home and Memories"
      max_length: 60
      text: Zeph now keeps some of your words.
    - key: shared.pattern_noticing.body
      name: "What changed, before Zeph keeps quotes: message"
      max_length: 400
      text: >-
        To notice what you do again and again, Zeph may keep short quotes of
        what you say, with a note on what was going on. They stay after your
        messages are deleted, until you delete them. See them on your Memories
        page under Things you said. Nothing is kept until you press Got it.
    - key: shared.pattern_noticing.got_it
      name: "What changed, before Zeph keeps quotes: button"
      max_length: 30
      text: Got it
    - key: shared.pattern_noticing.save_failed
