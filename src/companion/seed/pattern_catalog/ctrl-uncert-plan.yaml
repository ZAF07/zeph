# One Pattern Type of the Pattern Catalog (ADR-0025). Loaded when the backend
# starts. Any change needs a new `version`: a stored version never changes,
# so a change that keeps its version is refused and the last catalog stays.

id: CTRL.UNCERT.PLAN
version: 0.2.0
area: control
name: Control-seeking under uncertainty
status: draft

definition: >-
  When outcomes are uncertain, the person responds by planning, checking,
  gathering information or taking over. The discomfort comes from not
  knowing, and acting on it brings relief even when it changes nothing.

if: An important outcome is unknown or depends on others
then: Over-plans, seeks reassurance or takes control
function: To reduce the distress of uncertainty

frameworks:
  - Intolerance of uncertainty (Dugas and colleagues)
  - Big Five neuroticism (anxiety facet) with high conscientiousness
  - Beck's catastrophising distortion
  - Schwartz security value

signs:
  - id: I1
    text: Re-checks or refreshes for news on something they can't influence
    strength: moderate
    part: behaviour
  - id: I2
    text: Takes over a shared task rather than waiting on someone
    strength: moderate
    part: behaviour
  - id: I3
    text: Describes waiting as worse than a known bad outcome
    strength: strong
    part: inside
  - id: I4
    text: Builds contingency plans for unlikely scenarios
    strength: moderate
    part: behaviour
  - id: I5
    text: Irritation when plans change at short notice, out of proportion to the cost
    strength: weak
    part: inside

signs_against:
  - id: D1
    text: Comfortably leaves an important outcome open for days
    strength: strong
    part: inside
  - id: D2
    text: >-
      Plans heavily only where the stakes are concrete and planning changes
      the outcome (rational, not distress-driven)
    strength: moderate
    part: situation

look_alikes:
  - pattern_type: ACH.WORTH.PERF
    tells_apart: >-
      Controls to guarantee a good result for self-worth; uncertainty itself
      is tolerable
  - pattern_type: CONF.AVOID.BELONG
    tells_apart: Avoids the unknown only when the relationship is at stake
  - pattern_type: APPR.CONFIRM.CHOICE
    tells_apart: >-
      Seeks information or control over an outcome still open; the other
      seeks agreement about a choice already made
  - pattern_type: CTRL.SELF.RELY
    tells_apart: >-
      Uneasy about the outcome, whoever is doing it; the other distrusts
      people to come through, even when the outcome is clear
  - pattern_type: REL.CHECK.SECURE
    tells_apart: >-
      Uneasy about any unknown outcome; the other's not knowing is only about
      people and how they feel about them

anyone_would: A real crisis where control-seeking is adaptive

exclusions:
  - text: Active health or safety emergency
    evidence: ignored

approved_wording: >-
  Not knowing seems to weigh on you more than a bad answer would, so you reach
  for control.
prediction_wording: >-
  Next time you're waiting on {outcome}, notice how often you check and what
  changes when you do.

numbers:
  situations_needed: 3
  base_rate: 0.2
