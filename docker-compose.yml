# One setup for local and production (ADR-0005); only `.env` differs.
# Each service gets only the keys it needs. The Dashboard never receives
# backend secrets (database, Telegram, LLM, search keys).

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 5s
      retries: 30

  backend:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_DB: ${POSTGRES_DB:-}
      POSTGRES_HOST: postgres
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
      WEBHOOK_BASE_URL: ${WEBHOOK_BASE_URL:-}
      DASHBOARD_URL: ${DASHBOARD_URL:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      INITIAL_ADMIN_EMAILS: ${INITIAL_ADMIN_EMAILS:-}
      CHAT_CHANNEL_ADAPTER: ${CHAT_CHANNEL_ADAPTER:-}
      AUTH_VERIFIER_ADAPTER: ${AUTH_VERIFIER_ADAPTER:-}
      REPOSITORIES_ADAPTER: ${REPOSITORIES_ADAPTER:-}
      CLOCK_ADAPTER: ${CLOCK_ADAPTER:-}
      CHAT_MODEL_ADAPTER: ${CHAT_MODEL_ADAPTER:-}
      CONVERSATION_ENGINE_ADAPTER: ${CONVERSATION_ENGINE_ADAPTER:-}
      EMBEDDER_ADAPTER: ${EMBEDDER_ADAPTER:-}
      VECTOR_STORE_ADAPTER: ${VECTOR_STORE_ADAPTER:-}
      WEB_SEARCH_ADAPTER: ${WEB_SEARCH_ADAPTER:-}
      SCHEDULER_ADAPTER: ${SCHEDULER_ADAPTER:-}

  web:
    build: ./web
    depends_on:
      - backend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:-}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:-}

  ngrok:
    image: ngrok/ngrok:3
    profiles: ["local"]
    depends_on:
      - backend
    command: ["http", "--url=${NGROK_DOMAIN:-}", "backend:8000"]
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:-}

volumes:
  postgres-data:
