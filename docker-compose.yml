# One setup for local and production (ADR-0005); only `.env` differs.
# Each service gets only the keys it needs. The Dashboard never receives
# backend secrets (database, Telegram, LLM, search keys).
# Host ports come from WEB_PORT, BACKEND_PORT and POSTGRES_PORT so each git
# worktree can run its own stack (`make worktree-setup`). They are published
# on PORT_BIND_ADDRESS only (127.0.0.1 by default): Docker bypasses ufw, so
# only Caddy (80, 443) is reachable from outside the server.
# COMPOSE_PROFILES in `.env` picks the extra services: `local` (ngrok),
# `eval` (eval-runner), `prod` (Caddy). See docs/DEPLOYMENT_GUIDE.md.

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    ports:
      - "${PORT_BIND_ADDRESS:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 5s
      retries: 30

  backend:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${PORT_BIND_ADDRESS:-127.0.0.1}:${BACKEND_PORT:-8000}:8000"
    environment: &backend-environment
      POSTGRES_USER: ${POSTGRES_USER:-}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_DB: ${POSTGRES_DB:-}
      POSTGRES_HOST: postgres
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
      TELEGRAM_WEBHOOK_REGISTER: ${TELEGRAM_WEBHOOK_REGISTER:-}
      WEBHOOK_BASE_URL: ${WEBHOOK_BASE_URL:-}
      DASHBOARD_URL: ${DASHBOARD_URL:-http://localhost:${WEB_PORT:-3000}}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      INITIAL_ADMIN_EMAILS: ${INITIAL_ADMIN_EMAILS:-}
      CHAT_CHANNEL_ADAPTER: ${CHAT_CHANNEL_ADAPTER:-}
      AUTH_VERIFIER_ADAPTER: ${AUTH_VERIFIER_ADAPTER:-}
      REPOSITORIES_ADAPTER: ${REPOSITORIES_ADAPTER:-}
      CLOCK_ADAPTER: ${CLOCK_ADAPTER:-}
      CHAT_MODEL_ADAPTER: ${CHAT_MODEL_ADAPTER:-}
      EMBEDDER_ADAPTER: ${EMBEDDER_ADAPTER:-}
      VECTOR_STORE_ADAPTER: ${VECTOR_STORE_ADAPTER:-}
      TEXT_EXTRACTOR_ADAPTER: ${TEXT_EXTRACTOR_ADAPTER:-}
      WEB_SEARCH_ADAPTER: ${WEB_SEARCH_ADAPTER:-}
      SCHEDULER_ADAPTER: ${SCHEDULER_ADAPTER:-}
      MODEL_CALL_DEVELOPER_LOGS: ${MODEL_CALL_DEVELOPER_LOGS:-}
      MESSAGE_POOL_SIZE: ${MESSAGE_POOL_SIZE:-}
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8000/health')
      interval: 10s
      timeout: 5s
      start_period: 180s
      retries: 6

  # Works Eval Runs one at a time against its own Eval database (ADR-0013).
  # It always uses a recording chat channel and no web search, whatever the
  # adapter settings say, and runs no Check-ins.
  eval-runner:
    build: .
    command: ["python", "-m", "companion.eval_runner"]
    profiles: ["eval"]
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment: *backend-environment

  # A production build; NEXT_PUBLIC_* keys are build args (ADR-0005).
  web:
    build:
      context: ./web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:${BACKEND_PORT:-8000}}
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:-}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${PORT_BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-3000}:3000"
    environment:
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:-}
      SERVER_API_URL: http://backend:8000

  ngrok:
    image: ngrok/ngrok:3
    profiles: ["local"]
    restart: unless-stopped
    depends_on:
      - backend
    command: ["http", "--url=${NGROK_DOMAIN:-}", "backend:8000"]
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:-}

  # Production only: HTTPS in front of the Dashboard and backend, with
  # certificates from Let's Encrypt kept in caddy-data. See Caddyfile.
  caddy:
    image: caddy:2
    profiles: ["prod"]
    restart: unless-stopped
    depends_on:
      - backend
      - web
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      PRODUCTION_DOMAIN: ${PRODUCTION_DOMAIN:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
