[project]
name = "companion"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "ZAF07", email = "zaffere07@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "fastapi>=0.162.4",
    "fastembed>=0.9.1",
    "httpx>=0.28.1",
    "langchain-core>=1.7.7",
    "langchain-deepseek>=1.1.1",
    "langgraph>=1.2.20",
    "langgraph-checkpoint-postgres>=3.2.0",
    "pgvector>=0.5.1",
    "psycopg-pool>=3.3.3",
    "psycopg[binary]>=3.3.8",
    "pydantic-settings>=2.16.2",
    "pyjwt[crypto]>=2.15.1",
    "pypdf>=7.0.1",
    "python-multipart>=0.0.33",
    "pyyaml>=6.0.3",
    "sqlalchemy>=2",
    "tzdata>=2026.6",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.11.24,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
    "testcontainers[postgres]>=4.15.0",
    "types-pyyaml>=6.0.12.20261103",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-m 'not contract and not eval'"
markers = [
    "contract: needs a real external service and keys; run with `make contract`",
    "eval: measures the Companion with the real LLM; run with `make eval`",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "D", "TID"]
ignore = ["D100", "D104", "D105", "D107"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
"evals/test_*.py" = ["D"]
"src/companion/adapters/postgres/migrations/**" = ["D400", "D415"]

[tool.mypy]
strict = true
files = ["src", "scripts"]
plugins = ["pydantic.mypy"]
